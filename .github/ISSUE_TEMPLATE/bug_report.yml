name: Bug report
description: Report a reproducible problem in the API.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Never include credentials, bearer tokens, production data, real invoices, personal information, or customer records.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the unexpected API behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the route, method, and sanitized request shape, but no secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected response
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual response
      description: Remove tokens, personal data and production values.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or deployed version
    validations:
      required: false
